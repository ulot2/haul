name: Build Haul

# A push to main or dev only builds, to prove the code still compiles; the APK stays on the run page
# (download it with "gh run download"). Pushing a tag like v1.2.0 builds and publishes the release
# that the app offers as an update.
on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        # Tag builds use the tag. Other builds use the last release tag plus "-dev.<run>",
        # so the app never offers them as updates.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            last="${last:-v0.0.0}"
            v="${last#v}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build signed APK
        env:
          HAUL_KEY: ${{ secrets.HAUL_KEY }}
          HAUL_KEY_PASSWORD: ${{ secrets.HAUL_KEY_PASSWORD }}
          HAUL_VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$HAUL_KEY" ]; then
            # No key in the repo secrets yet: sign with a throwaway key, so the build still proves the code compiles.
            # Such an APK can't update one signed with the real key, so a release refuses to publish without it.
            [[ "$GITHUB_REF" == refs/tags/v* ]] && { echo "::error::Add the HAUL_KEY and HAUL_KEY_PASSWORD secrets before releasing"; exit 1; }
            echo "::warning::HAUL_KEY secret missing; signing with a throwaway key"
            HAUL_KEY_PASSWORD=throwaway
            keytool -genkeypair -keystore haul.p12 -storetype pkcs12 -storepass "$HAUL_KEY_PASSWORD" -keypass "$HAUL_KEY_PASSWORD" \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway"
            export HAUL_KEY_PASSWORD
          else
            # Strip spaces and line breaks that copying from a phone can add.
            printf '%s' "$HAUL_KEY" | tr -d ' \r\n\t' | base64 -d > haul.p12 \
              || { echo "::error::HAUL_KEY is not valid base64. Paste the whole of haul.p12.b64 into it again."; exit 1; }
            keytool -list -keystore haul.p12 -storetype pkcs12 -storepass "$HAUL_KEY_PASSWORD" >/dev/null \
              || { echo "::error::HAUL_KEY_PASSWORD does not open the key. Paste password.txt into it again."; exit 1; }
          fi
          export HAUL_KEY_ALIAS=$(keytool -list -keystore haul.p12 -storetype pkcs12 -storepass "$HAUL_KEY_PASSWORD" | grep PrivateKeyEntry | cut -d, -f1)
          gradle assembleRelease
          cp build/outputs/apk/release/*.apk Haul.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Haul.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        # The tag can come from "git push" (no release yet) or from publishing a release on GitHub (release exists).
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Haul.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" Haul.apk --title "Haul $VERSION" --generate-notes --latest
          fi
